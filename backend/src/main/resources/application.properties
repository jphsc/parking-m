quarkus.http.port=8085
quarkus.http.root-path=/api/v1

quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.write-dates-as-timestamps=false

#configuracao de CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# configuracoes openApi
mp.openapi.extensions.smallrye.info.title=Parking M
quarkus.smallrye-openapi.path=/parkingm-api-schema
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=Documentação da API do backend da aplicação ParkingM

# PRD
%prd.quarkus.flyway.migrate-at-start=true

%prd.quarkus.datasource.db-kind=postgresql
%prd.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/parkingm?options=-c%20timezone=America/Sao_Paulo
%prd.quarkus.datasource.username=postgres
%prd.quarkus.datasource.password=1234
%prd.quarkus.datasource.jdbc.driver=org.postgresql.Driver

# DEV
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:parkingm_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=1234
%dev.quarkus.datasource.jdbc.driver=org.h2.Driver

%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true

%dev.quarkus.h2.console.enabled=true
%dev.quarkus.h2.console.path=/h2-console


# TEST
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:parkingm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=1234
%test.quarkus.datasource.jdbc.driver=org.h2.Driver

%test.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.log.sql=true

%test.quarkus.h2.console.enabled=true
%test.quarkus.h2.console.path=/h2-console

